name: Build PC EXE and Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Output app name (no spaces)'
        required: false
        default: 'MyApp'
      entry_file:
        description: 'Main python entry file'
        required: false
        default: 'main.py'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare build source (zip OR loose files)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_src | Out-Null
          $zips = Get-ChildItem -Path "source" -Filter "*.zip" -File -ErrorAction SilentlyContinue
          if ($zips.Count -eq 1) {
            Write-Host "Found a single zip: $($zips[0].Name) -> extracting"
            Expand-Archive -Path $zips[0].FullName -DestinationPath build_src -Force
          } else {
            Write-Host "No single zip found -> copying loose files from source/ as-is"
            Copy-Item -Path "source/*" -Destination "build_src" -Recurse -Force -Exclude ".gitkeep"
          }
          $entry = "${{ github.event.inputs.entry_file }}"
          if (-not (Test-Path "build_src/$entry")) {
            Write-Host "ERROR: entry file '$entry' was not found inside source/. Aborting before wasting build time."
            Get-ChildItem -Recurse build_src | Select-Object -First 30
            exit 1
          }
          Write-Host "Source OK. Files found:"
          Get-ChildItem -Recurse build_src | Select-Object -First 30

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "build_src/requirements.txt") { pip install -r build_src/requirements.txt } else { Write-Host "No requirements.txt found, skipping." }
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        shell: pwsh
        env:
          KIVY_GL_BACKEND: angle_sdl2
        run: |
          cd build_src
          pyinstaller --onefile --noconsole --name "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.entry_file }}"

      - name: Verify EXE was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "build_src/dist/*.exe")) {
            Write-Host "ERROR: no .exe was produced. Check the PyInstaller log above."
            exit 1
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build_src/dist/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare build source (zip OR loose files)
        run: |
          mkdir -p build_src
          ZIP_COUNT=$(find source -maxdepth 1 -iname "*.zip" | wc -l)
          if [ "$ZIP_COUNT" -eq 1 ]; then
            ZIP_FILE=$(find source -maxdepth 1 -iname "*.zip")
            echo "Found a single zip: $ZIP_FILE -> extracting"
            unzip -o "$ZIP_FILE" -d build_src
          else
            echo "No single zip found -> copying loose files from source/ as-is"
            find source -mindepth 1 -maxdepth 1 ! -name ".gitkeep" -exec cp -r {} build_src/ \;
          fi
          ENTRY="${{ github.event.inputs.entry_file }}"
          if [ ! -f "build_src/$ENTRY" ]; then
            echo "ERROR: entry file '$ENTRY' was not found inside source/. Aborting before wasting build time."
            find build_src -maxdepth 2
            exit 1
          fi
          echo "Source OK. Files found:"
          find build_src -maxdepth 2

      - name: Ensure buildozer.spec exists
        run: |
          if [ ! -f build_src/buildozer.spec ]; then
            echo "No buildozer.spec found -> using default template"
            cp buildozer.spec.default build_src/buildozer.spec
            sed -i "s/title = MyApp/title = ${{ github.event.inputs.app_name }}/" build_src/buildozer.spec
          fi

      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: build_src
          buildozer_version: stable

      - name: Verify APK was produced
        run: |
          if [ -z "${{ steps.buildozer.outputs.filename }}" ]; then
            echo "ERROR: Buildozer did not produce an APK. Check the build log above."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.buildozer.outputs.filename }}

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist/windows

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/android

      - name: Create Release with build outputs
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }} - ${{ github.event.inputs.app_name }}"
          files: |
            dist/windows/*.exe
            dist/android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
