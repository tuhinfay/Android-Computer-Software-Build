      - name: Install system dependencies (Python/Buildozer path)
        if: steps.detect.outputs.type == 'python'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev automake
